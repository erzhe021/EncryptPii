apiVersion: v1
kind: Namespace
metadata:
  name: kong
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: encryptpii-kong
  namespace: kong
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: encryptpii-kong
  namespace: kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: encryptpii-kong
  template:
    metadata:
      labels:
        app: encryptpii-kong
    spec:
      serviceAccountName: encryptpii-kong
      automountServiceAccountToken: true
      containers:
        - name: kong
          image: encryptpii-kong:3.7
          imagePullPolicy: Never
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /etc/kong-config/kong.json
            - name: KONG_PLUGINS
              value: bundled,sensitive-transport-crypto
            - name: KONG_ADMIN_LISTEN
              value: 0.0.0.0:8001
            - name: KONG_ADMIN_GUI_LISTEN
              value: 0.0.0.0:8002
            - name: KONG_ADMIN_GUI_URL
              value: http://localhost:18002
            - name: KONG_ADMIN_GUI_API_URL
              value: http://localhost:18001
            - name: KONG_STATUS_LISTEN
              value: 0.0.0.0:8100
            - name: KONG_NGINX_HTTP_CLIENT_MAX_BODY_SIZE
              value: 16m
            - name: KONG_TO_ENCRYPTPII_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: encryptpii-gateway
                  key: token
          ports:
            - name: proxy
              containerPort: 8000
            - name: admin
              containerPort: 8001
            - name: manager
              containerPort: 8002
          volumeMounts:
            - name: config
              mountPath: /etc/kong-config
              readOnly: true
          startupProbe:
            httpGet:
              path: /status
              port: 8100
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /status
              port: 8100
          livenessProbe:
            httpGet:
              path: /status
              port: 8100
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: encryptpii-kong-config
---
apiVersion: v1
kind: Service
metadata:
  name: encryptpii-kong
  namespace: kong
spec:
  selector:
    app: encryptpii-kong
  ports:
    - name: proxy
      port: 8000
      targetPort: proxy
    - name: admin
      port: 8001
      targetPort: admin
    - name: manager
      port: 8002
      targetPort: manager
