server:
  port: 8080
crypto:
  server:
    base-url: http://localhost:9090
    endpoints:
      ecdh:
        ephemeral-public-key: /crypto/server/ecdh/ephemeral-public-key
        ecdsa-public-key: /crypto/server/ecdh/ecdsa-public-key
        bidirectional: /crypto/server/ecdh/bidirectional
        request-only: /crypto/server/ecdh/request-only
        response-only: /crypto/server/ecdh/response-only
sensitive:
  transport:
    crypto:
      enabled: false
logging:
  level:
    com.ikea.crypto: DEBUG