server:
  port: 9090

spring:
  cloud:
    vault:
      enabled: ${sensitive.transport.crypto.enabled:false}
      uri: ${VAULT_ADDR:http://127.0.0.1:8200}
      authentication: TOKEN # use TOKEN for local development, KUBERNETES for production
      token: ${VAULT_TOKEN:root} # use VAULT_TOKEN for local development, KUBERNETES for production
      # uncomment the following lines for production deployment with Kubernetes
#      kubernetes:
#        role: demo-service-role
#        kubernetes-path: kubernetes
#        service-account-token-file: /var/run/secrets/kubernetes.io/serviceaccount/token

sensitive:
  transport:
    crypto:
      enabled: true # default is false; set to 'true' to enable sensitive transport crypto
      auto-rotate: true # default is true; set to 'false' to require explicit key rotation
      key-lifecycle:
        validity-millis: 60000 # 60s
        rotation-before-expiry-millis: 20000 # 20s
        grace-period-millis: 10000 # 10s after replacement
      endpoint:
        base-path: /sensitive-transport-crypto # default is /sensitive-transport-crypto, you can change it to any other path, but make sure to update the client configuration accordingly
      vault:
        auto-bootstrap: true # default is true, if set to false, the key must be created manually in vault
        secret-path: secret/data/sensitive-transport-crypto/demo-service # change to your desired path in vault, make sure to update the client configuration accordingly
        key-alias: demo-service #change to your desired key alias in vault, make sure to update the client configuration accordingly

logging:
  level:
    com.ikea.crypto: DEBUG # default is INFO, you can change it to DEBUG for more detailed logs
