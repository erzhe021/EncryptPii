server:
  port: 9090

spring:
  cloud:
    vault:
      enabled: true
      uri: ${VAULT_ADDR:http://127.0.0.1:8200}
      authentication: TOKEN
      token: ${VAULT_TOKEN}
      kubernetes:
        role: crypto-server
        kubernetes-path: kubernetes
        service-account-token-file: :/var/run/secrets/kubernetes.io/serviceaccount/token

sensitive:
  transport:
    crypto:
      enabled: true #default is true, if set to false, the crypto server will not be started
      auto-rotate: true # default is true; set to 'false' to require explicit key rotation
      key-lifecycle:
        # 演示环境显式覆盖 SDK 默认值，以便更快观察密钥轮换。
        validity-millis: 60000 # 60s
        rotation-before-expiry-millis: 20000 # 20s
        grace-period-millis: 10000 # 10s after replacement
      endpoint:
        enabled: true #default is true, if set to false, the crypto server will not expose any endpoints
        base-path: /crypto/server # default is /crypto/server, you can change it to any other path, but make sure to update the client configuration accordingly
      vault:
        enabled: true #default is false, if set to true, the crypto server will use vault to store the transport key
        auto-bootstrap: true # default is true, if set to false, the key must be created manually in vault
        secret-path: secret/data/sensitive-transport-crypto/demo-service # change to your desired path in vault, make sure to update the client configuration accordingly
        key-alias: demo-service #change to your desired key alias in vault, make sure to update the client configuration accordingly

logging:
  level:
    com.ikea.crypto: INFO # default is INFO, you can change it to DEBUG for more detailed logs
