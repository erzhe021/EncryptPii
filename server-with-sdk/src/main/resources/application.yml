server:
  port: 9090

sensitive:
  transport:
    crypto:
      enabled: true #default is true, if set to false, the crypto server will not be started
      auto-rotate: ${CRYPTO_AUTO_ROTATE:true} # default is true; set to 'false' to require explicit key rotation
      key-lifecycle:
        validity-millis: ${CRYPTO_KEY_VALIDITY_MILLIS:60000} # 60s
        rotation-before-expiry-millis: ${CRYPTO_ROTATION_BEFORE_EXPIRY_MILLIS:20000} # 20s
        grace-period-millis: ${CRYPTO_KEY_GRACE_PERIOD_MILLIS:10000} # 10s after replacement
      endpoint:
        enabled: true #default is true, if set to false, the crypto server will not expose any endpoints
        base-path: /crypto/server # default is /crypto/server, you can change it to any other path, but make sure to update the client configuration accordingly
      vault:
        enabled: true #default is false, if set to true, the crypto server will use vault to store the transport key
        addr: ${VAULT_ADDR:http://127.0.0.1:8200}
        auth-method: ${VAULT_AUTH_METHOD:TOKEN} #default is TOKEN, other option is KUBERNETES
        auth-path: ${VAULT_AUTH_PATH:auth/kubernetes} #default is auth/kubernetes, only used when auth-method is KUBERNETES
        token: ${VAULT_TOKEN:root} #default is root, only used when auth-method is TOKEN
        auto-bootstrap: true # default is true, if set to false, the key must be created manually in vault
        secret-path: ${VAULT_SECRET_PATH:secret/data/sensitive-transport-crypto/rsa-ciam} # change to your desired path in vault, make sure to update the client configuration accordingly
        key-alias: ${VAULT_KEY_ALIAS:rsa-ciam} #change to your desired key alias in vault, make sure to update the client configuration accordingly

        kubernetes:
          role: ${VAULT_K8S_ROLE:crypto-server}
          token-path: ${VAULT_K8S_TOKEN_PATH:/var/run/secrets/kubernetes.io/serviceaccount/token}

logging:
  level:
    com.ikea.crypto: DEBUG # default is INFO, you can change it to DEBUG for more detailed logs
