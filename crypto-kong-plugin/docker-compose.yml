services:
  kong-database:
    image: postgres:14
    container_name: kong-database
    restart: always
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong123456
      POSTGRES_DB: kong
    volumes:
      - kong_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - kong-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 10s
      timeout: 5s
      retries: 5

  kong-migrations:
    image: kong:3.7
    container_name: kong-migrations
    command: kong migrations bootstrap
    depends_on:
      kong-database:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong123456
      KONG_PG_DATABASE: kong
    networks:
      - kong-net
    restart: on-failure

  kong:
    image: encryptpii-kong:3.7
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kong
    restart: always
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong123456
      KONG_PG_DATABASE: kong
      KONG_PLUGINS: bundled,crypto-kong-plugin
      KONG_NGINX_HTTP_CLIENT_MAX_BODY_SIZE: 16m
      ENCRYPTPII_VAULT_TOKEN: ${ENCRYPTPII_VAULT_TOKEN:-root}
      ENCRYPTPII_GATEWAY_TOKEN: ${ENCRYPTPII_GATEWAY_TOKEN:-}

      # 日志配置
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr

      # Admin API
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl

      # ========= Kong Manager 官方UI配置 =========
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      KONG_ADMIN_GUI_URL: ${KONG_ADMIN_GUI_URL:-http://localhost:8002}
      KONG_ADMIN_GUI_API_URL: ${KONG_ADMIN_GUI_API_URL:-http://localhost:8001}
      # 允许访问UI的域名/IP，服务器外网访问记得修改为你的服务器IP或域名
      KONG_ADMIN_GUI_AUTH: basic
      KONG_ADMIN_GUI_BASIC_AUTH_USER: admin
      KONG_ADMIN_GUI_BASIC_AUTH_PASSWORD: Admin@123456
    ports:
      - "8000:8000"   # http代理
      - "8443:8443"   # https代理
      - "8001:8001"   # Admin API
      - "8444:8444"   # Admin API HTTPS
      - "8002:8002"   # Kong Manager UI
    networks:
      - kong-net

networks:
  kong-net:

volumes:
  kong_pg_data:
