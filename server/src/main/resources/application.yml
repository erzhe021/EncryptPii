server:
  port: 9090

crypto:
  key:
    directory: ${user.dir}/server/src/main/resources/keys

logging:
  level:
    com.ikea.crypto: DEBUG

sensitive:
  transport:
    crypto:
      enabled: true
      endpoint:
        enabled: true
        base-path: /crypto/server/ecdh
      exception-handler:
        enabled: true
