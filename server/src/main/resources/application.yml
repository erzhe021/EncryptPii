server:
  port: 9090

crypto:
  vault:
    enabled: true
    addr: ${VAULT_ADDR:http://127.0.0.1:8200}
    auth-method: ${VAULT_AUTH_METHOD:TOKEN}
    auth-path: ${VAULT_AUTH_PATH:auth/kubernetes}
    token: ${VAULT_TOKEN:root}
    secret-path: ${VAULT_SECRET_PATH:secret/data/crypto/pii-transport-key}
    auto-bootstrap: true
    keyAlias: ${VAULT_KEY_ALIAS:pii-transport-key}
    validityMillis: ${VAULT_VALIDITY_MILLIS:60000} # 60s
    gracePeriodMillis: ${VAULT_GRACE_PERIOD_MILLIS:30000} # 30s
    kubernetes:
      role: ${VAULT_K8S_ROLE:crypto-server}
      token-path: ${VAULT_K8S_TOKEN_PATH:/var/run/secrets/kubernetes.io/serviceaccount/token}

logging:
  level:
    com.ikea.crypto: DEBUG
