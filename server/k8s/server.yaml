apiVersion: v1
kind: Namespace
metadata:
  name: encryptpii
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: encryptpii-server
  namespace: encryptpii
spec:
  replicas: 1
  selector:
    matchLabels:
      app: encryptpii-server
  template:
    metadata:
      labels:
        app: encryptpii-server
    spec:
      automountServiceAccountToken: false
      containers:
        - name: server
          image: encryptpii-server:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 9090
          env:
            - name: KONG_TO_ENCRYPTPII_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: encryptpii-gateway
                  key: token
            - name: LOGGING_LEVEL_COM_IKEA_CRYPTO
              value: INFO
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: encryptpii-server
  namespace: encryptpii
spec:
  selector:
    app: encryptpii-server
  ports:
    - name: http
      port: 9090
      targetPort: http
